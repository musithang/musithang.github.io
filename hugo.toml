baseURL = "https://musithang.github.io/"
locale = "en-us"
title = "MusiThang"

[outputs]
  home = ["HTML", "RSS", "robots"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.robots]
    mediaType = "text/plain"
    baseName = "robots"
    isPlainText = true

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "dracula"

[permalinks]
  posts = "/posts/:slug/"

[[menu.main]]
  name = "Index"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Records"
  url = "/posts/"
  weight = 2

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3

[[menu.main]]
  name = "Operator"
  url = "/about/"
  weight = 4

[params]
  description = "Technology · Life · Whatever Else"
  subtitle = "Personal Technical Archive"
  issueNumber = "01"
  volumeNumber = "01"
  footerDocNumber = "MT-2026-BLOG"
  osVersion = "MT-OS 4.0"
  geoCoords = "47.5N 19.0E"
  shelfCode = "MT-A"
  tickerItems = [
    "Now · rewriting the generator, again",
    "Status · online",
    "Coffee · critically low",
    "Uptime · 41 days",
  ]
