{{ define "main" }}
<section class="post-list">
  <div class="post-list__header">
    <span class="label-muted">Index of entries</span>
    <span class="label-muted">{{ len .Pages }} filed · newest first</span>
  </div>
  {{ partial "post-list-columns.html" . }}
  {{ range .Pages }}
    {{ partial "post-list-item.html" . }}
  {{ end }}
</section>
{{ end }}
