<header class="header">
  <div class="header__brand">
    <a href="/">
      <div class="header__logo">MusiThang</div>
      <div class="header__subtitle">Technology · Life · Whatever Else</div>
    </a>
  </div>
  <nav class="header__nav">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}" class="header__link{{ if $.IsMenuCurrent "main" . }} header__link--active{{ end }}">{{ .Name }}</a>
    {{ end }}
    <button class="header__search-btn" id="search-toggle" aria-label="Search">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      Search
    </button>
    <button class="header__theme-btn" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-switch">
        <span class="theme-switch__thumb"></span>
      </span>
      <span class="theme-label">Light</span>
    </button>
  </nav>
</header>
