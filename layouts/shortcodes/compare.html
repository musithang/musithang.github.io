{{- $width := .Get "width" | default "wide" -}}
<figure class="post-figure post-figure--{{ $width }}">
  <div class="compare">
    <div class="compare__panel">
      <div class="compare__label">{{ .Get "left" | default "Before" }}</div>
      <div class="compare__doc">
        <span class="compare__title"></span>
        <span class="compare__line"></span>
        <span class="compare__line"></span>
        <span class="compare__line"></span>
        <span class="compare__line compare__line--short"></span>
      </div>
    </div>
    <div class="compare__panel compare__panel--filed">
      <div class="compare__label compare__label--accent">{{ .Get "right" | default "After" }}</div>
      <div class="compare__doc">
        <div class="compare__head">
          <span>Entry MT-014</span>
          <span>Shelf MT-A</span>
        </div>
        <span class="compare__title"></span>
        <span class="compare__line"></span>
        <span class="compare__line"></span>
        <span class="compare__line"></span>
        <span class="compare__line compare__line--short"></span>
        <div class="compare__foot">
          <span>Status</span>
          <span>Shipped</span>
        </div>
        <span class="compare__mark compare__mark--tl" aria-hidden="true"></span>
        <span class="compare__mark compare__mark--br" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  {{- with .Get "caption" }}
  <figcaption class="post-figure__caption">{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>
